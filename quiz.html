<!DOCTYPE html>
<html>
<head>
  <title>My Awesome Quiz</title>
</head>
<body>

  <h1>Quiz Time!</h1>
  <p>Answer the questions that pop up.</p>

  <script>
    // This function asks a question and checks if the answer is correct.
    function ask(question, correct) {
      var answer = prompt(question);
      if (answer == correct) {
        alert("Good job!");
      } else {
        alert("Wrong!");
      }
    }

    // Here we "call" the function to ask our questions.
    ask("What is 5 x 5?", "25");
    ask("What is 10 x 10?", "100");
    ask("What is 3 x 3?", "9");

    // --- Add your own questions below this line! ---
    ask("What is 8 + 9?", "17");
    ask("What is 50 - 25?", "25");

  </script>

</body>
</html>
