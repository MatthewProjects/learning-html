<html>
  <script>
    // Count 1 to 9 (no spaces)
    for (var n = 1; n < 10; n++) {
      document.write(n);
    }
  </script>

  <script>
    // Count 10 to 19 (with spaces/newlines using writeln)
    for (var n = 10; n < 20; n++) {
      document.writeln(n);
    }
  </script>

  <script>
    // Count 20 to 39 (with spaces/newlines using writeln)
    for (var n = 20; n < 40; n++) {
      document.writeln(n);
    }
  </script>

  <script>
    // Write 10 down to 1 by transforming n
    for (var n = 1; n < 10; n++) {
      document.writeln(10 - n);
    }
  </script>

  <script>
    // Count down from 20 to 1
    for (var n = 20; n > 0; n--) {
      document.writeln(n);
    }
  </script>

  <script>
    // Count from 1 to 100
    for (var i = 1; i <= 100; i++) {
      console.log(i);
    }
  </script>

  <script>
    // Count from 1 to 1,000
    for (var i = 1; i <= 1000; i++) {
      console.log(i);
    }
  </script>
</html>
