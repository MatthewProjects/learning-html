<html>
  <button onclick="setbg('blue')">Go blue</button>
  <button onclick="setbg('green')">Go green</button>
  <button onclick="setbg('purple')">Go purple</button>
  <button onclick="setbg('orange')">Go orange</button>
  <script>
    function setbg(col){
      document.body.style.backgroundColor=col;
    }
  </script>
</html>
